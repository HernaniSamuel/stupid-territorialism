<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#dcd8cc">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>stupid territorialism</title>
<link rel="stylesheet" href="/src/styles/main.css">
<link rel="stylesheet" href="/src/styles/touch.css">
</head>
<body>
<canvas id="c"></canvas>
<div class="card" id="top">
  <svg viewBox="0 0 20 20"><path d="M18 10 3 18 5.5 10 3 2z" fill="#1a73e8" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>
  <span>stupid territorialism</span><span id="timer">4:00</span>
</div>
<div class="card" id="board"></div>
<div class="card" id="bottom">
  <span id="pips"></span>
  <span><b>WASD</b> andar</span>
  <span id="hintShoot"></span>
  <span><b>botão direito</b> fincar bandeira (3+, volte à 1ª pra fechar)</span>
  <span><b>M</b> mapa · <b>R</b> reiniciar · <b>N</b> som</span>
</div>
<div id="toast"></div>
<div id="dead"></div>
<div id="end"><div class="box"><h2 id="endT"></h2><div id="endL"></div><button id="again" type="button">Jogar de novo</button><p>ou aperte <b>R</b></p></div></div>

<!-- Controles de toque: só aparecem em aparelhos de toque (html.touch). Veja src/input/touch.ts -->
<div id="touch">
  <div id="stickZone"></div>
  <div id="stickBase"><div id="stickKnob"></div></div>

  <div id="topButtons">
    <button class="tbtn" id="btnMap" type="button" aria-label="Mapa">
      <svg viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z M9 4v14 M15 6v14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>
    </button>
    <button class="tbtn" id="btnSound" type="button" aria-label="Som">
      <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <button class="tbtn" id="btnRestart" type="button" aria-label="Reiniciar">
      <svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 102.1-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M4 4v4.5h4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="tbtn" id="btnFull" type="button" aria-label="Tela cheia" hidden>
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <button class="abtn" id="btnPlant" type="button" aria-label="Fincar bandeira">
    <svg viewBox="0 0 24 24"><path d="M6 21V3" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M6 4l12 4.5L6 13z" fill="currentColor"/></svg>
  </button>
  <button class="abtn" id="btnFire" type="button" aria-label="Atirar">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
</div>

<!-- Aviso quando o telefone está em pé: o jogo pausa até girar -->
<div id="rotate"><div>
  <svg viewBox="0 0 24 24" width="56" height="56"><rect x="7" y="2.5" width="10" height="19" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M20.5 8.5a9 9 0 01-.6 6.3M21 14.5l-1.1 1.2-1.5-1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <p>Gire o aparelho pra jogar deitado</p>
</div></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
