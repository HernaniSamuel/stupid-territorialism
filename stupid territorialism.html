<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>stupid territorialism</title>
<style>
:root{--ink:#202124;--sub:#5f6368;--line:#dadce0}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#dcd8cc;font-family:"Google Sans",Roboto,"Segoe UI",system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.card{position:fixed;background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(60,64,67,.3),0 1px 2px rgba(60,64,67,.2)}
#top{top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:9px 20px;border-radius:28px;font-weight:600;font-size:15px;white-space:nowrap}
#top svg{width:18px;height:18px}
#timer{font-variant-numeric:tabular-nums;color:var(--sub);border-left:1px solid var(--line);padding-left:12px}
#board{top:14px;left:14px;width:240px;padding:10px 12px}
#board h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin-bottom:6px;font-weight:600}
.row{display:grid;grid-template-columns:16px 1fr 38px;gap:4px 8px;align-items:center;font-size:13px;padding:4px 0}
.row .nm{font-weight:500}.row.me .nm{font-weight:700}
.row .pc{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.row .bar{grid-column:2/4;height:4px;background:#eee;border-radius:3px;overflow:hidden;margin-top:-2px}
.row .bar i{display:block;height:100%}
.row .kd{font-size:11px;color:var(--sub);font-weight:400;margin-left:6px}
#bottom{bottom:14px;left:50%;transform:translateX(-50%);padding:10px 18px;display:flex;gap:18px;align-items:center;font-size:12.5px;color:var(--sub);border-radius:24px;white-space:nowrap}
#pips{display:flex;gap:5px;align-items:center}
#pips i{width:11px;height:11px;border-radius:50%;border:2px solid #bbb;display:block}
#pips i.on{background:var(--c);border-color:var(--c)}
#bottom b{color:var(--ink)}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(32,33,36,.92);color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
#dead{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:28px;font-weight:700;color:#d93025;text-shadow:0 1px 0 #fff,0 0 12px #fff;display:none;pointer-events:none}
#end{position:fixed;inset:0;background:rgba(32,33,36,.55);display:none;align-items:center;justify-content:center}
#end .box{background:#fff;border-radius:18px;padding:26px 32px;min-width:300px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
#end h2{font-size:22px;margin-bottom:12px}
#end p{margin-top:14px;color:var(--sub);font-size:13px}
@media(max-width:820px){#bottom{display:none}#board{width:200px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="card" id="top">
  <svg viewBox="0 0 20 20"><path d="M18 10 3 18 5.5 10 3 2z" fill="#1a73e8" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>
  <span>stupid territorialism</span><span id="timer">4:00</span>
</div>
<div class="card" id="board"></div>
<div class="card" id="bottom">
  <span id="pips"></span>
  <span><b>WASD</b> andar</span>
  <span id="hintShoot"></span>
  <span><b>botão direito</b> fincar bandeira (3+, volte à 1ª pra fechar)</span>
  <span><b>M</b> mapa · <b>R</b> reiniciar · <b>N</b> som</span>
</div>
<div id="toast"></div>
<div id="dead"></div>
<div id="end"><div class="box"><h2 id="endT"></h2><div id="endL"></div><p>Aperte <b>R</b> pra jogar de novo (novo mapa)</p></div></div>

<script>
(()=>{
// ================= CONFIG (mexa à vontade pra testar o "fun") =================
const CFG={
  cols:13, rows:9, sp:96, jit:0.2, keepEdge:0.9, diag:0.14, parkP:0.12,
  speed:150, botSpeed:132, ownBonus:1.2,
  maxFlags:6, botCount:3, round:240, winPct:50,
  bulletSpeed:700, bulletRange:330, shotCd:0.45, botShotCd:1.0, botAimErr:0.14, botSight:250,
  hitR:12, flagR:14, respawn:3, invuln:1.6, botMaxLoop:950,
  // 'street' = tiro sai pra frente pela rua (WASD + espaço); 'free' = tiro em linha reta com mira do mouse
  shotMode:'street', streetRange:300, streetBulletSpeed:420, streetMaxTurn:35
};
const COLORS=[{n:'Você',c:'#1a73e8'},{n:'Vermelho',c:'#ea4335'},{n:'Roxo',c:'#9334e6'},{n:'Laranja',c:'#f29900'}];

// ================= estado =================
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr}
addEventListener('resize',resize);resize();

let nodes,adj,edges,faces,hf,spc,agents,bullets,parts,player,timeLeft,over,totalArea,map;
let cam={x:0,y:0},zoom=1.35,zoomT=1.35,overview=false;
const rnd=Math.random;

// ================= geração do mapa =================
function genMap(){
  const {cols,rows,sp}=CFG;
  nodes=[];edges=[];spc=new Map();
  const id=(i,j)=>j*cols+i;
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
    const border=i===0||j===0||i===cols-1||j===rows-1;
    const J=sp*(border?0.07:CFG.jit);
    nodes.push({x:i*sp+(rnd()-.5)*2*J,y:j*sp+(rnd()-.5)*2*J});
  }
  const par=nodes.map((_,i)=>i);
  const find=x=>par[x]===x?x:(par[x]=find(par[x]));
  const has=new Set();const key=(a,b)=>a<b?a*10000+b:b*10000+a;
  const add=(a,b)=>{const k=key(a,b);if(has.has(k))return false;has.add(k);edges.push([a,b]);par[find(a)]=find(b);return true};
  const cand=[],removed=[];
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
    if(i<cols-1)cand.push([id(i,j),id(i+1,j),j===0||j===rows-1]);
    if(j<rows-1)cand.push([id(i,j),id(i,j+1),i===0||i===cols-1]);
  }
  for(const c of cand){if(c[2]||rnd()<CFG.keepEdge)add(c[0],c[1]);else removed.push(c)}
  removed.sort(()=>rnd()-.5);
  for(const r of removed)if(find(r[0])!==find(r[1]))add(r[0],r[1]);
  for(let j=0;j<rows-1;j++)for(let i=0;i<cols-1;i++){
    if(rnd()<CFG.diag){rnd()<.5?add(id(i,j),id(i+1,j+1)):add(id(i+1,j),id(i,j+1))}
  }
  const N=nodes.length;
  adj=nodes.map(()=>[]);
  for(const [a,b] of edges){
    const dx=nodes[b].x-nodes[a].x,dy=nodes[b].y-nodes[a].y,len=Math.hypot(dx,dy);
    adj[a].push({to:b,len,ang:Math.atan2(dy,dx)});
    adj[b].push({to:a,len,ang:Math.atan2(-dy,-dx)});
  }
  adj.forEach(l=>l.sort((p,q)=>p.ang-q.ang));
  // faces (quarteirões) por travessia de meias-arestas
  const vis=new Set(),raw=[];
  for(let u=0;u<N;u++)for(const e of adj[u]){
    const v0=e.to;if(vis.has(u*N+v0))continue;
    const loop=[],hes=[];let a=u,b=v0;
    do{
      vis.add(a*N+b);loop.push(a);hes.push([a,b]);
      const nb=adj[b];const idx=nb.findIndex(x=>x.to===a);
      const w=nb[(idx-1+nb.length)%nb.length].to;a=b;b=w;
    }while(!(a===u&&b===v0));
    let s=0;for(let k=0;k<loop.length;k++){const p=nodes[loop[k]],q=nodes[loop[(k+1)%loop.length]];s+=p.x*q.y-q.x*p.y}
    raw.push({loop,hes,area:s/2});
  }
  let outer=0;raw.forEach((f,i)=>{if(f.area<raw[outer].area)outer=i});
  faces=[];hf=new Map();
  raw.forEach((f,i)=>{
    if(i===outer||f.area<150)return;
    let best=null,bl=0;
    for(const [a,b] of f.hes){const l=Math.hypot(nodes[b].x-nodes[a].x,nodes[b].y-nodes[a].y);if(l>bl){bl=l;best=[a,b]}}
    const A=nodes[best[0]],B=nodes[best[1]];
    const nx=-(B.y-A.y)/bl,ny=(B.x-A.x)/bl;
    const probe={x:(A.x+B.x)/2+nx*3,y:(A.y+B.y)/2+ny*3};
    const idx=faces.length;
    faces.push({loop:f.loop,pts:f.loop.map(n=>nodes[n]),area:f.area,probe,owner:-1,flash:0,park:rnd()<CFG.parkP});
    f.hes.forEach(([a,b])=>hf.set(a*N+b,idx));
  });
  totalArea=faces.reduce((s,f)=>s+f.area,0);
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  nodes.forEach(n=>{x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x);y1=Math.max(y1,n.y)});
  map={x0,y0,x1,y1,cx:(x0+x1)/2,cy:(y0+y1)/2,w:x1-x0,h:y1-y0};
}

// ================= grafo utilidades =================
function elen(a,b){const l=adj[a];for(let i=0;i<l.length;i++)if(l[i].to===b)return l[i].len;return 0}
function nearestNode(x,y){let b=0,bd=1e12;for(let i=0;i<nodes.length;i++){const d=(nodes[i].x-x)**2+(nodes[i].y-y)**2;if(d<bd){bd=d;b=i}}return b}
function sp(src){
  let r=spc.get(src);if(r)return r;
  const N=nodes.length,dist=new Float64Array(N).fill(1e12),prev=new Int32Array(N).fill(-1),done=new Uint8Array(N);
  dist[src]=0;
  for(let it=0;it<N;it++){
    let u=-1,bd=1e12;for(let i=0;i<N;i++)if(!done[i]&&dist[i]<bd){bd=dist[i];u=i}
    if(u<0)break;done[u]=1;
    for(const e of adj[u]){const nd=bd+e.len;if(nd<dist[e.to]){dist[e.to]=nd;prev[e.to]=u}}
  }
  r={dist,prev};spc.set(src,r);return r;
}
function path(a,b){const {prev}=sp(a);const p=[];for(let v=b;v!==-1;v=prev[v]){p.push(v);if(v===a)break}return p.reverse()}
function loopNodes(fl){const out=[];for(let i=0;i<fl.length;i++){const p=path(fl[i],fl[(i+1)%fl.length]);for(let k=0;k<p.length-1;k++)out.push(p[k])}return out}
function loopLength(fl){let s=0;for(let i=0;i<fl.length;i++)s+=sp(fl[i]).dist[fl[(i+1)%fl.length]];return s}
function pip(p,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a.y>p.y)!==(b.y>p.y)&&p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x)c=!c}return c}
function enclosed(fl){
  if(fl.length<3)return[];
  const poly=loopNodes(fl).map(n=>nodes[n]);
  return faces.filter(f=>pip(f.probe,poly));
}

// ================= agentes =================
function makeAgent(id,human){
  const base=[[60,map.y1-40],[map.x1-60,map.y0+40],[60,map.y0+40],[map.x1-60,map.y1-40]][id];
  const n=nearestNode(base[0],base[1]);
  return {id,human,name:COLORS[id].n,color:COLORS[id].c,base:n,a:n,b:adj[n][0].to,d:0,mv:0,x:nodes[n].x,y:nodes[n].y,vx:0,vy:0,ang:-Math.PI/2,
    alive:true,respawnT:0,invT:CFG.invuln,cd:0,kills:0,deaths:0,flags:[],route:[],plan:[],face:1};
}
function place(ag){
  const A=nodes[ag.a],B=nodes[ag.b],L=elen(ag.a,ag.b)||1,t=Math.min(1,Math.max(0,ag.d/L));
  ag.x=A.x+(B.x-A.x)*t;ag.y=A.y+(B.y-A.y)*t;
}
function nodeAt(ag){const L=elen(ag.a,ag.b);if(ag.d<=0.001)return ag.a;if(ag.d>=L-0.001)return ag.b;return -1}
function nodeNear(ag,r){const n=nearestNode(ag.x,ag.y);return Math.hypot(nodes[n].x-ag.x,nodes[n].y-ag.y)<=r?n:-1}
function advance(ag,dist,pick){
  let rem=dist,g=0;
  while(rem>1e-6&&g++<12){
    if(ag.mv===0){
      const n=nodeAt(ag);if(n<0)return;
      const w=pick(n);if(w<0)return;
      ag.a=n;ag.b=w;ag.d=0;ag.mv=1;
    }
    const L=elen(ag.a,ag.b);
    if(ag.mv>0){
      const can=L-ag.d;
      if(rem<can){ag.d+=rem;rem=0}
      else{ag.d=L;rem-=can;const n=ag.b,w=pick(n);if(w>=0){ag.a=n;ag.b=w;ag.d=0;ag.mv=1}else{ag.mv=0;return}}
    }else{
      const can=ag.d;
      if(rem<can){ag.d-=rem;rem=0}
      else{ag.d=0;rem-=can;const n=ag.a,w=pick(n);if(w>=0){ag.a=n;ag.b=w;ag.d=0;ag.mv=1}else{ag.mv=0;return}}
    }
  }
}
function onOwnTurf(ag){
  const N=nodes.length;
  const f1=hf.get(ag.a*N+ag.b),f2=hf.get(ag.b*N+ag.a);
  return (f1!==undefined&&faces[f1].owner===ag.id)||(f2!==undefined&&faces[f2].owner===ag.id);
}

// ================= input =================
const keys={};let mouse={x:0,y:0},mouseDown=false;
addEventListener('keydown',e=>{
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(e.repeat)return;
  keys[e.code]=true;
  if(e.code==='KeyR')newGame();
  if(e.code==='KeyM'){overview=!overview}
  if(e.code==='KeyN'){mute=!mute;say(mute?'Som desligado':'Som ligado',900)}
});
function tryPlant(){
  if(over||!player.alive)return;
  const n=nodeNear(player,30);
  if(n<0)say('Pare num cruzamento pra fincar a bandeira');else plant(player,n);
}
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keyup',e=>{keys[e.code]=false});
cv.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
cv.addEventListener('mousedown',e=>{mouse.x=e.clientX;mouse.y=e.clientY;if(e.button===0)mouseDown=true;if(e.button===2)tryPlant()});
addEventListener('mouseup',()=>{mouseDown=false});
cv.addEventListener('wheel',e=>{e.preventDefault();overview=false;zoomT=Math.min(2.2,Math.max(.6,zoomT*(e.deltaY<0?1.1:.91)))},{passive:false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouseDown=false});
function inputVec(){
  const x=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
  const y=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
  const m=Math.hypot(x,y);return m?{x:x/m,y:y/m}:{x:0,y:0};
}
function mouseWorld(){return{x:(mouse.x-W/2)/zoom+cam.x,y:(mouse.y-H/2)/zoom+cam.y}}
function playerSteer(ag,v){
  if(!v.x&&!v.y){ag.mv=0;return}
  if(nodeAt(ag)>=0)return;
  const A=nodes[ag.a],B=nodes[ag.b],l=Math.hypot(B.x-A.x,B.y-A.y)||1;
  const dot=(v.x*(B.x-A.x)+v.y*(B.y-A.y))/l;
  if(Math.abs(dot)>0.35)ag.mv=dot>0?1:-1;
}
function pickPlayer(n){
  const v=inputVec();if(!v.x&&!v.y)return -1;
  let best=-1,bd=0.3;
  for(const e of adj[n]){const d=v.x*Math.cos(e.ang)+v.y*Math.sin(e.ang);if(d>bd){bd=d;best=e.to}}
  return best;
}

// ================= som =================
let AC=null,mute=false;
function beep(f,d,type='square',v=.035,slide=0){
  if(mute)return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}
function sfx(k,ag){
  if(ag&&!ag.human&&player&&Math.hypot(ag.x-player.x,ag.y-player.y)>320)return;
  if(k==='shot')beep(520,.09,'square',.03,-300);
  if(k==='plant')beep(660,.12,'triangle',.06,200);
  if(k==='claim'){beep(520,.12,'triangle',.07);setTimeout(()=>beep(780,.2,'triangle',.07),110)}
  if(k==='kill')beep(220,.25,'sawtooth',.05,-150);
  if(k==='break')beep(300,.18,'sawtooth',.05,-200);
}

// ================= UI helpers =================
const $=id=>document.getElementById(id);
let toastT=0;
function say(msg,ms=2400){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms)}

// ================= regras =================
function plant(ag,node){
  if(!ag.alive)return false;
  const f=ag.flags;
  if(f.length>=3&&node===f[0]){closeLoop(ag);return true}
  if(f.includes(node)){if(ag.human)say('Já tem bandeira sua aqui');return false}
  if(f.length>=CFG.maxFlags){if(ag.human)say(`Máximo de ${CFG.maxFlags} bandeiras – volte à primeira pra fechar`);return false}
  f.push(node);sfx('plant',ag);
  if(ag.human&&f.length===3)say('Agora volte à 1ª bandeira (botão direito) pra fechar o território');
  return true;
}
function closeLoop(ag){
  const fs=enclosed(ag.flags);
  let gain=0;
  for(const f of fs)if(f.owner!==ag.id){gain+=f.area;f.owner=ag.id;f.flash=1}
  ag.flags=[];
  if(gain>0){
    sfx('claim',ag);
    if(ag.human)say(`Território fechado! +${(gain/totalArea*100).toFixed(1)}%`);
    else if(player.alive&&fs.length)say(`${ag.name} tomou território (+${(gain/totalArea*100).toFixed(1)}%)`,1600);
  }else if(ag.human)say('Nada novo cercado');
}
function destroyChain(owner,by){
  if(!owner.flags.length)return;
  owner.flags=[];owner.plan=[];owner.route=[];
  sfx('break',by);
  if(owner.human)say(`${by.name} destruiu suas bandeiras!`);
  else if(by.human)say(`Você destruiu as bandeiras do ${owner.name}`);
}
function kill(v,k){
  if(!v.alive)return;
  v.alive=false;v.respawnT=CFG.respawn;v.flags=[];v.plan=[];v.route=[];v.deaths++;k.kills++;
  for(let i=0;i<16;i++){const a=rnd()*6.283,s=40+rnd()*140;parts.push({x:v.x,y:v.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.6+rnd()*.4,c:v.color})}
  sfx('kill',v);
  if(v.human)say(`${k.name} te acertou!`);else if(k.human)say(`Você derrubou o ${v.name}`,1400);
}
function respawn(ag){
  let cand=[];
  for(const f of faces)if(f.owner===ag.id)for(const n of f.loop)cand.push(n);
  const n=cand.length?cand[(rnd()*cand.length)|0]:ag.base;
  ag.a=n;ag.b=adj[n][0].to;ag.d=0;ag.mv=0;ag.alive=true;ag.invT=CFG.invuln;ag.cd=.4;place(ag);
}
// continuação "na mesma rua": segue a aresta que menos desvia da direção atual (até streetMaxTurn graus)
function pickStraight(b){
  const min=Math.cos(CFG.streetMaxTurn*Math.PI/180);
  return n=>{
    const A=nodes[b.a],B=nodes[b.b];let dx=B.x-A.x,dy=B.y-A.y;
    if(b.mv<0){dx=-dx;dy=-dy}
    const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
    let best=-1,bd=min;
    for(const e of adj[n]){const d=dx*Math.cos(e.ang)+dy*Math.sin(e.ang);if(d>bd){bd=d;best=e.to}}
    return best;
  };
}
function traceShot(ag){
  const b={a:ag.a,b:ag.b,d:ag.d,mv:ag.face||1,x:ag.x,y:ag.y},pick=pickStraight(b);
  const pts=[{x:b.x,y:b.y}];let left=CFG.streetRange;
  while(left>0){
    const step=Math.min(10,left);advance(b,step,pick);
    if(b.mv===0)break;
    place(b);pts.push({x:b.x,y:b.y});left-=step;
  }
  return pts;
}
function shoot(ag,tx,ty,err=0){
  if(ag.cd>0||!ag.alive)return;
  if(CFG.shotMode==='street'){
    bullets.push({street:true,a:ag.a,b:ag.b,d:ag.d,mv:ag.face||1,x:ag.x,y:ag.y,px:ag.x,py:ag.y,left:CFG.streetRange,life:1,owner:ag,tr:[]});
    ag.cd=ag.human?CFG.shotCd:CFG.botShotCd;sfx('shot',ag);return;
  }
  const a=Math.atan2(ty-ag.y,tx-ag.x)+err;
  bullets.push({x:ag.x,y:ag.y,px:ag.x,py:ag.y,vx:Math.cos(a)*CFG.bulletSpeed,vy:Math.sin(a)*CFG.bulletSpeed,life:CFG.bulletRange/CFG.bulletSpeed,owner:ag});
  ag.cd=ag.human?CFG.shotCd:CFG.botShotCd;sfx('shot',ag);
}

// ================= bots =================
function botArrive(bot,node){
  if(bot.plan.length&&bot.plan[0]===node){
    plant(bot,node);bot.plan.shift();bot.route=[];
    if(!bot.plan.length)bot.flags=[];
  }
}
function planClaim(bot,node){
  let best=null,bs=-1;
  for(let t=0;t<14;t++){
    const c=nodes[nearestNode(bot.x+(rnd()-.5)*600,bot.y+(rnd()-.5)*450)];
    const k=3+((rnd()*3)|0),R=70+rnd()*120,a0=rnd()*6.283,pts=new Set();
    for(let i=0;i<k;i++){const ang=a0+i*6.283/k+(rnd()-.5)*.5;pts.add(nearestNode(c.x+Math.cos(ang)*R,c.y+Math.sin(ang)*R))}
    const fl=[...pts];if(fl.length<3)continue;
    const len=loopLength(fl);if(len>CFG.botMaxLoop)continue;
    let gain=0;for(const f of enclosed(fl)){if(f.owner!==bot.id)gain+=f.area*(f.owner>=0?1.3:1)}
    if(gain<=0)continue;
    const dist=Math.hypot(nodes[fl[0]].x-nodes[node].x,nodes[fl[0]].y-nodes[node].y);
    const sc=gain/(len+dist*.6+200);
    if(sc>bs){bs=sc;best=fl}
  }
  if(!best)return null;
  let bi=0,bd=1e12;best.forEach((n,i)=>{const d=sp(node).dist[n];if(d<bd){bd=d;bi=i}});
  const rot=best.slice(bi).concat(best.slice(0,bi));
  return rot.concat([rot[0]]);
}
function botThink(bot,node){
  if(bot.plan.length){bot.route=path(node,bot.plan[0]).slice(1);return}
  const r=rnd(),foes=agents.filter(o=>o!==bot&&o.alive);
  if(r<.35){
    let bf=-1,bd=1e12;
    for(const o of foes)for(const fn of o.flags){const d=sp(node).dist[fn];if(d<bd&&d<700){bd=d;bf=fn}}
    if(bf>=0){bot.route=path(node,bf).slice(1);return}
  }
  if(r<.5&&foes.length){
    let t=null,bd=1e12;for(const o of foes){const d=Math.hypot(o.x-bot.x,o.y-bot.y);if(d<bd){bd=d;t=o}}
    bot.route=path(node,nearestNode(t.x,t.y)).slice(1,3);if(bot.route.length)return;
  }
  const p=planClaim(bot,node);
  if(p){bot.plan=p;bot.route=path(node,p[0]).slice(1)}
}
function botPick(bot,node){
  botArrive(bot,node);
  if(!bot.route.length){
    botThink(bot,node);botArrive(bot,node);
    if(!bot.route.length&&bot.plan.length)bot.route=path(node,bot.plan[0]).slice(1);
  }
  while(bot.route.length&&bot.route[0]===node)bot.route.shift();
  const w=bot.route.shift();
  return w===undefined?adj[node][(rnd()*adj[node].length)|0].to:w;
}
function botCombat(bot){
  if(bot.cd>0)return;
  if(CFG.shotMode==='street'){
    const pts=traceShot(bot);
    for(const o of agents){
      if(o===bot||!o.alive||o.invT>0)continue;
      if(pts.some(p=>Math.hypot(p.x-o.x,p.y-o.y)<CFG.hitR*1.4)){shoot(bot);return}
    }
    return;
  }
  let t=null,bd=1e9;
  for(const o of agents)if(o!==bot&&o.alive&&o.invT<=0){const d=Math.hypot(o.x-bot.x,o.y-bot.y);if(d<bd){bd=d;t=o}}
  if(!t||bd>CFG.botSight)return;
  const tt=bd/CFG.bulletSpeed*.6;
  shoot(bot,t.x+t.vx*tt,t.y+t.vy*tt,(rnd()-.5)*2*CFG.botAimErr);
}

// ================= loop =================
function update(dt){
  for(const f of faces)if(f.flash>0)f.flash=Math.max(0,f.flash-dt*1.2);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}
  parts=parts.filter(p=>p.life>0);
  if(over)return;
  timeLeft-=dt;
  if(timeLeft<=0){timeLeft=0;endGame();return}
  for(const ag of agents){
    if(!ag.alive){ag.respawnT-=dt;if(ag.respawnT<=0)respawn(ag);continue}
    ag.cd=Math.max(0,ag.cd-dt);ag.invT=Math.max(0,ag.invT-dt);
    const px=ag.x,py=ag.y,mul=onOwnTurf(ag)?CFG.ownBonus:1;
    if(ag.human){
      playerSteer(ag,inputVec());
      advance(ag,CFG.speed*mul*dt,pickPlayer);
      if(mouseDown||keys.Space){const m=mouseWorld();shoot(ag,m.x,m.y)}
    }else{
      advance(ag,CFG.botSpeed*mul*dt,n=>botPick(ag,n));
      botCombat(ag);
    }
    place(ag);
    if(ag.mv!==0)ag.face=ag.mv;
    ag.vx+=((ag.x-px)/dt-ag.vx)*Math.min(1,dt*10);ag.vy+=((ag.y-py)/dt-ag.vy)*Math.min(1,dt*10);
    if(ag.mv!==0){
      const A=nodes[ag.a],B=nodes[ag.b],ta=Math.atan2((B.y-A.y)*ag.mv,(B.x-A.x)*ag.mv);
      let df=ta-ag.ang;df=Math.atan2(Math.sin(df),Math.cos(df));ag.ang+=df*Math.min(1,dt*14);
    }
  }
  // bandeiras tocadas por inimigos
  for(const ag of agents){
    if(!ag.alive)continue;
    for(const o of agents){
      if(o===ag||!o.flags.length)continue;
      for(const fn of o.flags)if(Math.hypot(nodes[fn].x-ag.x,nodes[fn].y-ag.y)<CFG.flagR){destroyChain(o,ag);break}
    }
  }
  // balas
  for(const b of bullets){
    b.px=b.x;b.py=b.y;
    if(b.street){
      const dd=CFG.streetBulletSpeed*dt;
      advance(b,dd,pickStraight(b));place(b);
      if(b.mv===0)b.life=0;else{b.left-=dd;if(b.left<=0)b.life=0}
      b.tr.push({x:b.x,y:b.y});if(b.tr.length>6)b.tr.shift();
    }else{b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt}
    for(const ag of agents){
      if(ag===b.owner||!ag.alive||ag.invT>0)continue;
      // distância ponto-segmento (evita atravessar o alvo)
      const sx=b.x-b.px,sy=b.y-b.py,l2=sx*sx+sy*sy||1;
      let t=((ag.x-b.px)*sx+(ag.y-b.py)*sy)/l2;t=Math.max(0,Math.min(1,t));
      if(Math.hypot(b.px+sx*t-ag.x,b.py+sy*t-ag.y)<CFG.hitR){kill(ag,b.owner);b.life=0;break}
    }
  }
  bullets=bullets.filter(b=>b.life>0);
  // câmera
  const tz=overview?Math.min(W/(map.w+160),H/(map.h+200)):zoomT;
  zoom+=(tz-zoom)*Math.min(1,dt*6);
  const tx=overview?map.cx:player.x,ty=overview?map.cy:player.y;
  cam.x+=(tx-cam.x)*Math.min(1,dt*6);cam.y+=(ty-cam.y)*Math.min(1,dt*6);
}

// ================= render =================
const chainCache=new Map();
function chainInfo(ag){
  const k=ag.flags.join(',');
  let c=chainCache.get(ag.id);
  if(c&&c.k===k)return c;
  const open=[];
  for(let i=0;i<ag.flags.length-1;i++){const p=path(ag.flags[i],ag.flags[i+1]);open.push(...(i?p.slice(1):p))}
  let close=[];
  if(ag.flags.length>=3)close=path(ag.flags[ag.flags.length-1],ag.flags[0]);
  c={k,open,close,fill:enclosed(ag.flags)};chainCache.set(ag.id,c);return c;
}
function polyPath(pts){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath()}
function strokeNodes(list){ctx.beginPath();list.forEach((n,i)=>i?ctx.lineTo(nodes[n].x,nodes[n].y):ctx.moveTo(nodes[n].x,nodes[n].y));ctx.stroke()}
function drawFlag(n,color,first,t){
  const p=nodes[n];
  if(first){ctx.beginPath();ctx.arc(p.x,p.y,9+Math.sin(t*6)*1.5,0,6.283);ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke()}
  ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x,p.y-22);ctx.strokeStyle='#3c4043';ctx.lineWidth=2.2;ctx.stroke();
  ctx.beginPath();ctx.moveTo(p.x,p.y-22);ctx.lineTo(p.x+15,p.y-17);ctx.lineTo(p.x,p.y-11);ctx.closePath();
  ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
  ctx.beginPath();ctx.arc(p.x,p.y,3,0,6.283);ctx.fillStyle='#3c4043';ctx.fill();
}
function render(t){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#dcd8cc';ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2,H/2);ctx.scale(zoom,zoom);ctx.translate(-cam.x,-cam.y);
  ctx.lineCap='round';ctx.lineJoin='round';
  // quarteirões
  for(const f of faces){
    polyPath(f.pts);ctx.fillStyle=f.park?'#cfe6c2':'#f3f0e8';ctx.fill();
    if(f.owner>=0){ctx.globalAlpha=.34+f.flash*.45;ctx.fillStyle=COLORS[f.owner].c;ctx.fill();ctx.globalAlpha=1}
  }
  // prévia do que será fechado
  for(const ag of agents){
    if(ag.flags.length>=3){
      const c=chainInfo(ag);ctx.globalAlpha=.16;ctx.fillStyle=ag.color;
      for(const f of c.fill){polyPath(f.pts);ctx.fill()}
      ctx.globalAlpha=1;
    }
  }
  // ruas
  ctx.beginPath();for(const [a,b] of edges){ctx.moveTo(nodes[a].x,nodes[a].y);ctx.lineTo(nodes[b].x,nodes[b].y)}
  ctx.strokeStyle='#bfc4c9';ctx.lineWidth=13;ctx.stroke();
  ctx.strokeStyle='#fff';ctx.lineWidth=9;ctx.stroke();
  // bordas de território
  const N=nodes.length;
  for(const [a,b] of edges){
    const f1=hf.get(a*N+b),f2=hf.get(b*N+a);
    const o1=f1!==undefined?faces[f1].owner:-1,o2=f2!==undefined?faces[f2].owner:-1;
    if(o1===o2)continue;
    ctx.beginPath();ctx.moveTo(nodes[a].x,nodes[a].y);ctx.lineTo(nodes[b].x,nodes[b].y);
    if(o1>=0){ctx.setLineDash([]);ctx.strokeStyle=COLORS[o1].c;ctx.lineWidth=5;ctx.stroke()}
    if(o2>=0){ctx.setLineDash(o1>=0?[8,8]:[]);ctx.strokeStyle=COLORS[o2].c;ctx.lineWidth=5;ctx.stroke();ctx.setLineDash([])}
  }
  // cercas em construção
  for(const ag of agents){
    if(!ag.flags.length)continue;
    const c=chainInfo(ag);
    ctx.setLineDash([10,8]);ctx.lineDashOffset=-t*30;ctx.strokeStyle=ag.color;ctx.lineWidth=5;
    if(c.open.length)strokeNodes(c.open);
    ctx.globalAlpha=.4;if(c.close.length)strokeNodes(c.close);ctx.globalAlpha=1;
    ctx.setLineDash([]);
  }
  for(const ag of agents)ag.flags.forEach((n,i)=>drawFlag(n,ag.color,i===0&&ag.flags.length>=3,t));
  // balas
  for(const b of bullets){
    ctx.beginPath();
    if(b.street){b.tr.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.lineTo(b.x,b.y)}
    else{ctx.moveTo(b.x-b.vx*.025,b.y-b.vy*.025);ctx.lineTo(b.x,b.y)}
    ctx.strokeStyle=b.owner.color;ctx.lineWidth=5;ctx.stroke();
  }
  // partículas
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.fillRect(p.x-2,p.y-2,4,4)}
  ctx.globalAlpha=1;
  // prévia do caminho do tiro (pela rua)
  if(CFG.shotMode==='street'&&player.alive){
    const pts=traceShot(player);
    ctx.globalAlpha=player.cd>0?.18:.5;ctx.setLineDash([3,7]);ctx.strokeStyle=player.color;ctx.lineWidth=4;
    ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();
    ctx.setLineDash([]);ctx.globalAlpha=1;
  }
  // triângulos
  for(const ag of agents){
    if(!ag.alive)continue;
    if(ag.invT>0&&Math.floor(t*10)%2)continue;
    ctx.save();ctx.translate(ag.x,ag.y);
    if(ag.human){
      ctx.beginPath();ctx.arc(0,0,20+Math.sin(t*5)*2,0,6.283);ctx.fillStyle='rgba(26,115,232,.16)';ctx.fill();
      if(CFG.shotMode!=='street'){
        const m=mouseWorld(),aa=Math.atan2(m.y-ag.y,m.x-ag.x);
        ctx.beginPath();ctx.moveTo(Math.cos(aa)*20,Math.sin(aa)*20);ctx.lineTo(Math.cos(aa)*34,Math.sin(aa)*34);
        ctx.strokeStyle='rgba(26,115,232,.8)';ctx.lineWidth=3;ctx.stroke();
      }
    }
    ctx.rotate(ag.ang);
    ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(-10,-10);ctx.lineTo(-10,10);ctx.closePath();
    ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=6;ctx.shadowOffsetY=2;
    ctx.fillStyle=ag.color;ctx.fill();ctx.shadowColor='transparent';
    ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

// ================= HUD / fim =================
function areas(){const a=COLORS.map(()=>0);for(const f of faces)if(f.owner>=0)a[f.owner]+=f.area;return a}
function hud(){
  const ar=areas();
  const rows=agents.map(a=>({a,p:ar[a.id]/totalArea*100})).sort((x,y)=>y.p-x.p);
  $('board').innerHTML='<h4>Território</h4>'+rows.map(r=>`<div class="row ${r.a.human?'me':''}"><svg width="14" height="14" viewBox="0 0 20 20"><path d="M18 10 3 18 3 2z" fill="${r.a.color}" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg><span class="nm">${r.a.name}<span class="kd">${r.a.kills}☠ ${r.a.deaths}†</span></span><span class="pc">${r.p.toFixed(0)}%</span><div class="bar"><i style="width:${Math.min(100,r.p*2)}%;background:${r.a.color}"></i></div></div>`).join('');
  const m=Math.floor(timeLeft/60),s=Math.floor(timeLeft%60);
  $('timer').textContent=m+':'+String(s).padStart(2,'0');
  $('pips').style.setProperty('--c',player.color);
  $('pips').innerHTML='<span style="margin-right:4px">Bandeiras</span>'+Array.from({length:CFG.maxFlags},(_,i)=>`<i class="${i<player.flags.length?'on':''}"></i>`).join('');
  const d=$('dead');
  if(!player.alive&&!over){d.style.display='block';d.textContent='Renasce em '+Math.ceil(player.respawnT)}else d.style.display='none';
  if(!over&&rows[0].p>=CFG.winPct)endGame();
}
function endGame(){
  if(over)return;over=true;
  const ar=areas();
  const rows=agents.map(a=>({a,p:ar[a.id]/totalArea*100})).sort((x,y)=>y.p-x.p);
  $('endT').textContent=rows[0].a.human?'Você venceu! 🏆':'Vitória do '+rows[0].a.name;
  $('endL').innerHTML=rows.map((r,i)=>`<div class="row ${r.a.human?'me':''}" style="grid-template-columns:20px 1fr 50px"><span>${i+1}º</span><span class="nm" style="color:${r.a.color}">${r.a.name}</span><span class="pc">${r.p.toFixed(1)}%</span></div>`).join('');
  $('end').style.display='flex';
}

function newGame(){
  genMap();
  agents=[makeAgent(0,true)];
  for(let i=1;i<=CFG.botCount;i++)agents.push(makeAgent(i,false));
  agents.forEach(place);
  player=agents[0];bullets=[];parts=[];chainCache.clear();
  timeLeft=CFG.round;over=false;overview=false;
  cam.x=player.x;cam.y=player.y;
  $('end').style.display='none';
  const street=CFG.shotMode==='street';
  cv.style.cursor=street?'default':'crosshair';
  $('hintShoot').innerHTML=street?'<b>espaço/clique esq.</b> atirar pra frente, pela rua (<b>S</b> inverte)':'<b>mouse</b> mirar · <b>clique/espaço</b> atirar';
  say('Ande até um cruzamento, finque bandeiras (botão direito) e volte à 1ª pra cercar quarteirões',4200);
}

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  update(dt);render(now/1000);
  requestAnimationFrame(frame);
}
newGame();
setInterval(hud,120);
requestAnimationFrame(frame);
// gancho p/ testes automáticos
window.__game={get agents(){return agents},get faces(){return faces},get nodes(){return nodes},get adj(){return adj},CFG,plant,endGame,hud,shoot,place,traceShot,elen};
})();
